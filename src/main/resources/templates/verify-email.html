
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | Trade Logger</title>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>

<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <h1>Verify Your Email</h1>
      <p>Enter the 6-digit verification code sent to your email.</p>
    </div>

    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${success}" class="alert success" th:text="${success}"></div>

    <form th:action="@{/api/auth/verify-email}" method="post">

      <div class="form-group">
        <label for="otp">Verification Code</label>
        <input
                type="text"
                id="otp"
                name="otp"
                placeholder="Enter 6-digit OTP"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                required>
      </div>

      <button type="submit" class="auth-button">
        Verify Email
      </button>

    </form>

    <form th:action="@{/api/auth/resend-otp}" method="post" style="margin-top: 15px;">
      <button type="submit" class="auth-button">
        Resend OTP
      </button>
    </form>

    <div class="auth-footer">
      <a th:href="@{/register}">Back to Registration</a>
    </div>

  </div>
</div>

</body>
</html>
