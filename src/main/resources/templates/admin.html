<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Trade Logger</title>

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <style>
        .admin-container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 24px;
        }

        .admin-header {
            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: #f1f5f9;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .admin-header p {
            color: #94a3b8;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .admin-card {
            background: #111a2e;
            border: 1px solid #263653;
            border-radius: 16px;
            padding: 24px;
        }

        .admin-card h3 {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
        }

        .admin-card .value {
            color: #f8fafc;
            font-size: 30px;
            font-weight: 700;
            margin-top: 12px;
        }

        .admin-section {
            background: #111a2e;
            border: 1px solid #263653;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .admin-section h2 {
            color: #f1f5f9;
            margin-bottom: 20px;
        }

        .admin-table-wrapper {
            overflow-x: auto;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
        }

        .admin-table th,
        .admin-table td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #263653;
            color: #cbd5e1;
        }

        .admin-table th {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .admin-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .admin-badge.admin {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .admin-back {
            display: inline-block;
            margin-bottom: 20px;
            color: #818cf8;
            text-decoration: none;
        }

        .admin-back:hover {
            color: #a5b4fc;
        }

        @media (max-width: 600px) {
            .admin-container {
                margin: 15px auto;
                padding: 15px;
            }

            .admin-section {
                padding: 16px;
            }

            .admin-table th,
            .admin-table td {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<div class="admin-container">

    <a href="/" class="admin-back">← Back to Dashboard</a>

    <div class="admin-header">
        <h1>Admin Dashboard</h1>
        <p>Trade Logger administration panel</p>
    </div>

    <div class="admin-grid">

        <div class="admin-card">
            <h3>Total Users</h3>
            <div class="value" th:text="${totalUsers}">0</div>
        </div>

        <div class="admin-card">
            <h3>Administrator</h3>
            <div class="value" th:text="${totalAdmins}">0</div>
        </div>

        <div class="admin-card">
            <h3>Regular Users</h3>
            <div class="value" th:text="${totalRegularUsers}">0</div>
        </div>

        <div class="admin-card">
            <h3>System Status</h3>
            <div class="value" style="font-size: 20px; color: #34d399;">Operational</div>
        </div>

    </div>

    <div class="admin-section">
        <h2>Registered Users</h2>

        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Registration Date</th>
                    <th>Role</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"></td>

                    <td>
                        <span class="admin-badge"
                              th:classappend="${user.role == 'ADMIN' ? ' admin' : ''}"
                              th:text="${user.role}">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="admin-section">
        <h2>Admin Access</h2>
        <p style="color: #94a3b8;">
            You are logged in with administrator privileges.
        </p>
    </div>

</div>

</body>
</html>
